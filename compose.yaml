services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rms-api
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
