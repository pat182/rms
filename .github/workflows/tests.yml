
name: RMS Tests

on:
  push:
  pull_request:

permissions:
  contents: read


jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    env:
      APP_NAME: RMS Tests
      DEBUG: "false"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: rms_test
      DB_USER: rms_test
      DB_PASSWORD: test_password
      SECRET_KEY: test_secret_key_for_ci_only
      JWT_HASHING_ALGORITHM: HS256
      JWT_MINUTES: "30"
      JWT_REFRESH_DAYS: "7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/ -v

